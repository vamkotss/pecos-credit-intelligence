[project]
name = "pecos-credit-intelligence"
version = "0.3.0"
description = "Document intelligence for middle-market commercial lending: OCR, hybrid retrieval, evaluated RAG, and a grounded credit-memo agent."
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

# Declared explicitly so import ordering is identical on Windows, in the
# container, and in CI. Left to inference, ruff classifies `pecos` differently
# depending on whether the package is installed, which causes I001 churn.
[tool.ruff.lint.isort]
known-first-party = ["pecos"]

[tool.pytest.ini_options]
markers = [
    "slow: renders PDFs or runs OCR; slower than the pure-python tests",
]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
