name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: src
  PC_CI_MODE: "1"
  PC_SEED: "20260804"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Verify no secrets are committed
        run: |
          if [ -f .env ]; then
            echo "::error::.env is present in the repository. Secrets must never be committed."
            exit 1
          fi
          if grep -rInE 'sk-[A-Za-z0-9]{20,}' --include='*.py' --include='*.md' --include='*.yml' . ; then
            echo "::error::A string resembling an API key was found in tracked files."
            exit 1
          fi
          echo "No committed secrets detected."

      - name: Tests
        run: python -m pytest
