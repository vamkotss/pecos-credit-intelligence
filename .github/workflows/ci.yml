name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: src
  PC_CI_MODE: "1"
  PC_SEED: "20260804"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Tesseract is the only external binary this project needs. The base
      # package carries the orientation-detection data (osd.traineddata) that
      # M3's rotation handling depends on; -eng is the English language model.
      # Poppler is deliberately not installed: PyMuPDF renders pages and
      # pdfplumber parses text, so nothing shells out to it.
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (ruff)
        run: ruff format --check src tests scripts

      - name: Verify no secrets are committed
        run: |
          if [ -f .env ]; then
            echo "::error::.env is present in the repository. Secrets must never be committed."
            exit 1
          fi
          if grep -rInE 'sk-[A-Za-z0-9]{20,}' --include='*.py' --include='*.md' --include='*.yml' . ; then
            echo "::error::A string resembling an API key was found in tracked files."
            exit 1
          fi
          echo "No committed secrets detected."

      - name: Tests
        run: python -m pytest
